name: Public source coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *'

permissions:
  contents: read

concurrency:
  group: public-source-audit
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install bounded Japanese OCR tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-jpn
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit registered public sources without sending notifications
        run: python -m sakurano_line_notifier.source_audit --output source-audit.json
      - name: Check deployed per-source quality independently of HTTP readiness
        if: always()
        run: python -m sakurano_line_notifier.release_quality --output public-quality.json
      - name: Preserve public-source evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: public-source-quality
          path: |
            source-audit.json
            public-quality.json
          retention-days: 14
          if-no-files-found: warn
