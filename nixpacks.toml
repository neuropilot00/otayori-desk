# Keep Railway's existing NIXPACKS Python provider and start command.
# aptPkgs are installed into the runtime image; no OCR downloads at runtime.
# https://nixpacks.com/docs/configuration/file#apt-packages
[phases.setup]
aptPkgs = ["...", "poppler-utils", "tesseract-ocr", "tesseract-ocr-jpn"]

# Fail the build if the deployed image cannot provide Japanese OCR.
[phases.ocr-check]
dependsOn = ["install"]
cmds = ["pdftoppm -v", "tesseract --list-langs | grep -x jpn"]
